appId: com.nocap.app
productName: noCap
copyright: Copyright © 2025

directories:
  output: dist-app
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*

extraResources:
  # PyInstaller onedir bundle: nocap-server/ directory → Resources/backend/nocap-server/
  - from: build/backend/nocap-server
    to: backend/nocap-server
    filter:
      - "**/*"
  # Whisper model file → Resources/whisper_models/
  - from: build/whisper_models
    to: whisper_models
    filter:
      - "*.pt"
  # Demucs weights (torch.hub layout) → Resources/demucs_models/checkpoints/
  - from: build/demucs_models
    to: demucs_models
    filter:
      - "checkpoints/*.th"

afterPack: scripts/after-pack.cjs

mac:
  category: public.app-category.music
  icon: build/icon.icns
  # No Developer ID certificate: skip electron-builder signing (it would otherwise pick
  # any local "Apple Development" cert, which other Macs do not trust). The afterPack
  # hook ad-hoc signs instead. Set an identity here once a Developer ID is available.
  identity: null
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # The PyInstaller backend is built for the host CPU (Apple Silicon), so only arm64
  # packages work; an x64 app would ship an arm64 backend.
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]

dmg:
  title: noCap
  window:
    width: 540
    height: 380
  contents:
    - x: 130
      y: 200
    - x: 410
      y: 200
      type: link
      path: /Applications

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
