<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent}
svg{display:block}
</style></head><body>
<svg id="svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const v = new URLSearchParams(location.search).get('v') || 'glow';
// Continuous-corner squircle (superellipse n=5) for the 824px body at (100,100).
function squircle(cx, cy, r, n) {
  const pts = [];
  for (let i = 0; i < 720; i++) {
    const t = (i / 720) * Math.PI * 2, c = Math.cos(t), s = Math.sin(t);
    pts.push([cx + r * Math.sign(c) * Math.abs(c) ** (2 / n), cy + r * Math.sign(s) * Math.abs(s) ** (2 / n)]);
  }
  return 'M' + pts.map(p => p.map(x => x.toFixed(2)).join(',')).join('L') + 'Z';
}
const body = squircle(512, 512, 412, 5);
const bg = {
  glow: `<radialGradient id="bg" cx="50%" cy="38%" r="70%"><stop offset="0" stop-color="#3b0a07"/><stop offset=".55" stop-color="#140707"/><stop offset="1" stop-color="#070708"/></radialGradient>`,
  grid: `<radialGradient id="bg" cx="50%" cy="40%" r="72%"><stop offset="0" stop-color="#2a0a08"/><stop offset=".6" stop-color="#101012"/><stop offset="1" stop-color="#08080a"/></radialGradient>`,
  metal: `<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c2c31"/><stop offset=".5" stop-color="#18181c"/><stop offset="1" stop-color="#0c0c0e"/></linearGradient>`,
}[v];
let grid = '';
if (v === 'grid') {
  for (let i = 1; i < 8; i++) {
    const x = 100 + i * 103;
    grid += `<line x1="${x}" y1="100" x2="${x}" y2="924" stroke="#fff" stroke-opacity="${i % 2 ? .035 : .07}" stroke-width="2"/>`;
    grid += `<line x1="100" y1="${x}" x2="924" y2="${x}" stroke="#fff" stroke-opacity=".04" stroke-width="2"/>`;
  }
}
const glowOpacity = v === 'metal' ? .22 : .5;
document.getElementById('svg').innerHTML = `
<defs>
  ${bg}
  <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".3" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#fff" stop-opacity=".02"/></linearGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff2a00" stop-opacity="${glowOpacity}"/><stop offset="1" stop-color="#ff2a00" stop-opacity="0"/></radialGradient>
  <clipPath id="clip"><path d="${body}"/></clipPath>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".5"/></filter>
  <filter id="logoShadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".65"/></filter>
</defs>
<path d="${body}" fill="url(#bg)" filter="url(#shadow)"/>
<g clip-path="url(#clip)">
  ${grid}
  <ellipse cx="512" cy="560" rx="360" ry="330" fill="url(#glow)"/>
</g>
<path d="${body}" fill="none" stroke="url(#rim)" stroke-width="3"/>
<image href="../../source/logo-transparent.png" x="${512 - 616 * 0.62 + 0}" y="${514 - 629.5 * 0.62}" width="${1254 * 0.62}" height="${1254 * 0.62}" filter="url(#logoShadow)"/>
`;
</script></body></html>
